# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 30
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/ui"
    versioning-strategy: increase
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 30
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/mobile"
    versioning-strategy: increase
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 30
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Expo SDK pins exact versions of native modules; major bumps break the
    # build. Upgrade via `npx expo install --fix` instead.
    # React Native and the native modules are pinned by the Expo SDK even
    # within 0.x "minor" versions (react-native 0.86 -> 0.88 broke the
    # Android build: AGP needed a newer Gradle than Expo's template), so
    # only Expo SDK upgrades may move them.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "@react-native/*"
