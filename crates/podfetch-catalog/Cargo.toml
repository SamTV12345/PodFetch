[package]
name = "podfetch-catalog"
version = "0.1.0"
edition = "2024"
description = "Podcast catalog bounded context: podcasts, episodes, chapters, feeds"

[lints]
workspace = true

[features]
default = []
sqlite = ["common-infrastructure/sqlite", "podfetch-events/sqlite"]
postgresql = ["common-infrastructure/postgresql", "podfetch-events/postgresql"]

[dependencies]
common-infrastructure = { workspace = true }
podfetch-events = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
diesel = { workspace = true }
reqwest = { workspace = true }
rss = { workspace = true }
opml = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true }
