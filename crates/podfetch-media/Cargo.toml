[package]
name = "podfetch-media"
version = "0.1.0"
edition = "2024"
description = "Media library bounded context: episode files, downloads, SponsorBlock"

[lints]
workspace = true

[features]
default = []
sqlite = ["common-infrastructure/sqlite", "podfetch-events/sqlite", "podfetch-identity/sqlite"]
postgresql = ["common-infrastructure/postgresql", "podfetch-events/postgresql", "podfetch-identity/postgresql"]

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true }

[dependencies]
common-infrastructure = { workspace = true }
podfetch-events = { workspace = true }
podfetch-identity = { workspace = true }
podfetch-kernel = { workspace = true }
chrono = { workspace = true }
diesel = { workspace = true }
file-format = { workspace = true }
id3 = { workspace = true }
mp4ameta = { workspace = true }
podfetch-storage = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha256 = { workspace = true }
strfmt = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
